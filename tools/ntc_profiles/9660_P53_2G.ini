# PPTP NTC 换算档 —— 项目 9660_P53_2G(9660 / P53 / 2G)
#
# 换板子:复制本文件为 <项目名>.ini,改数值即可。
#     python tools/ntc_convert.py <samples.csv> --profile <项目名>
# 公式对所有板子都一样,不一样的只有下面这些常数。
#
# 数值来源是厂商的参考实现 transformNTCToTemp(Java)—— 它在板上真的跑,而且
# 一个常数都不从配置读,全是字面量。所以定下这些数的是代码,不是厂商那份
# temp.ini。厂商原件逐字留在 templates/temp_template.ini,两者冲突以代码为准。
# 见 docs/DECISIONS.md D-63 / D-64。
#
# 本档只留转换真正读到的键。厂商原件里的 NTC COUNT / NTC ERR DETECT /
# NTC CPU PATH / NTC CPU TEMP COMP / NTC TEMP COMP(裸键)本工具都不读,已删;
# 要对照看 templates 里的原件,不要以为厂商没写过这些项。
# 特别注明裸键 NTC TEMP COMP:厂商原件给的是 20,但 NTC1/NTC2 存在时它是死键,
# 留着会让人误以为补了 20 ℃。这里删掉,补偿只由下面按通道的两行决定。

[NTC]

# 分压上拉电阻,单位 kΩ。对应参考实现里的 4700F。
NTC R = 4.7;
NTC R2 = 4.7;

# ADC 满量程【计数】,不是最大码值。1024 即 10 位 ADC,最大码 1023 —— 正是
# 参考实现里的 1023 - adcVal。12 位板写 4096。
NTC SAR VALUE MAX = 1024;

# NTC B 常数,按通道。两段式,与参考实现一致:先按 B=4010,分压电阻升过
# NTC B SWITCH R 之后换成 B=3950。
#
# 切换点本质是个【温度】,写成电阻是因为 Java 还没算出温度就先判电阻。3588 Ω
# 在 3950 曲线上正好是 50.00 ℃,而同样算法在 4010 曲线上得 3532.8 Ω —— 所以
# 3588 显然来自 3950 那侧。规则读作:冷于 50 ℃ → 3950,50 ℃ 及以上 → 4010。
NTC B VALUE = 4010;
NTC B VALUE2 = 4010;
NTC B VALUE COLD = 3950;
NTC B VALUE COLD2 = 3950;

# 冷端 B 接管处的电阻,单位 Ω。Java 比的是欧姆(if (resister > 3588F)),严格
# 大于 —— 恰好 3588 仍走热端 B。
# 这一行必须和上面两个 COLD 键一起给;要么给全要么都不给。都不给 = 单 B 转换
# (2026-09-21 之前所有档的行为),对没有该切换的实现仍然有效。只给一个会被拒。
NTC B SWITCH R = 3588;

# 25 ℃ 标称阻值,单位 kΩ。对应 Java 的 R0 = 10*1000。
NTC RESISTANCE = 10;
NTC RESISTANCE2 = 10;

# 按通道的温度补偿,单位 ℃。参考实现的转换函数里不加任何补偿,故为 0。
NTC1 TEMP COMP = 0;
NTC2 TEMP COMP = 0;

# 各通道对应的 sysfs 节点,顺序同 perf_monitor(ntc_lcd, ntc_led)。
# 【不用来读任何东西】—— 归档的 samples.csv 里已经有原始计数。它只用来和
# samples.csv 头部那行 # ntc_paths= 对账,让"拿错板子的档"报出来,而不是
# 悄悄按错的曲线换算。
NTC1 PATH = "/sys/bus/iio/devices/iio:device0/in_voltage3_raw";
NTC2 PATH = "/sys/bus/iio/devices/iio:device0/in_voltage2_raw";

# 认为物理上合理的范围,单位 ℃。越界的读数报 oor 并排除在均值之外 —— 永不钳位。
NTC VALUE MIN = -20;
NTC VALUE MAX = 100;

# 1 = 走上面的公式。0 是查表法,本工具不实现,遇到时直接拒绝而不是近似。
NTC OBTAIN TEMP WAY = 1;

# ---------- 以下键是 PPTP 自己的,厂商配置里没有 ----------

# 原始计数达到或超过此值即视为短路/开路节点,不产出温度。复现参考实现的
# adcVal >= 1000 拒绝。缺省 1000。
PPTP ADC INVALID MIN = 1000;
