# ===========================================================================
# VENDOR TEMPLATE - NOT A RUNNABLE PROFILE. DO NOT POINT --profile AT IT.
#
# This is the vendor's NTC config file, transcribed as supplied on 2026-09-20,
# kept here for two reasons:
#
#   1. It is the artifact to take to the vendor when asking which constants the
#      firmware is SUPPOSED to read. As of 2026-09-21 the answer from the code
#      is "none of them": the formula path is implemented by
#      `transformNTCToTemp`, a Java method built entirely from literals, and
#      nothing in this file reaches it. That is exactly the open question.
#   2. It is the shape to copy when this platform is pointed at another board -
#      the key names, the `KEY = value;` syntax and the `:` separators are all
#      the vendor's.
#
# WHY IT LIVES IN templates/ AND NOT NEXT TO THE REAL PROFILE
#   `list_profiles()` globs `*.ini` NON-recursively, so a file in this
#   subdirectory is invisible to `--list-profiles` and unselectable. That is
#   deliberate: this file carries no cold-side B, so running it would silently
#   convert this board with the pre-2026-09-21 single-B rule. A profile that is
#   quietly wrong for the board it names is the one failure mode this whole
#   directory exists to avoid.
#
# The comments are the vendor's own, in Chinese, left verbatim - including the
# transcription damage (`NTC R2 = 4.7:` with a colon, node paths spelled with
# spaces where the real device uses underscores, and one comment line that
# wrapped onto a line of its own). Do not "fix" them here: this file's value is
# being the thing that was actually received.
#
# This project's real conversion constants are in ../9660_P53_2G.ini, taken from
# the reference implementation. See docs/DECISIONS.md D-63 (why the conversion
# lives in a separate tool at all) and D-64 (where the numbers come from).
# ===========================================================================

[NTC]
#NTC个数
NTC COUNT = 2;
#NTC温度获取异常检测标志位
NTC ERR DETECT =1;
#NTC并联电阻阻值，单位:kΩ 及SAR口最大值
NTC R=4.7;
NTC R2 = 4.7:
NTC SAR VALUE MAX = 1024;
#NTC B-value
NTC B VALUE = 4010;
NTC B VALUE2 = 4010;
#NTC Zero Power Resistance at 25℃,Unit KΩ
NTC RESISTANCE = 10;
NTC RESISTANCE2 = 10:
#查表法需要修正的温度差
NTC TEMP COMP =20;
#NTC节点地址，排序为LCD、LED、CPU，初始化风扇档位要根据NTC1 path温度进行
NTC1 PATH ="/sys/bus/iio/devices/iio:device0/in voltage3 raw";
NTC2 PATH ="/sys/bus/iio/devices/iio:device0/in voltage2 raw";
NTC CPU PATH="/sys/class/thermal/thermal zone0/temp";
#NTC温度补偿值，与地址的序号对应
NTC1 TEMP COMP =0;
NTC2 TEMP COMP =0;
NTC CPU TEMP COMP =0;
#开机初始化设置风扇转速参考的NTC
NTC BOOT START TYPE = 1;
#开机初始化，参考NTC温度设置风扇转速是否拉满的值
NTC BOOT START TEMP = 32;
#Rtm阻值数值列表的序号
#0:跃泰达6140-020033-02ZZ0001
光蜗 片式NTC热敏散热片
#1:
NTC RTM INDEX=1;
NTC RTM INDEX2 = 1;
#NTC可以获取的温度最大值与最小值
#实际查表或计算默认按这个范围
NTC VALUE MAX = 100;
NTC VALUE MIN = -20;
#根据NTC的ADC值得到温度的方法 0:查表法 1:公式计算法
NTC OBTAIN TEMP WAY = 1;
