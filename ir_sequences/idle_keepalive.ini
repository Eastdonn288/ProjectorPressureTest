[sequence]
# Idle keepalive for long playback stress runs (YouTube / Prime Video / Netflix /
# the local media player). Pick it in perf_monitor's "定时发按键的 ini" param and
# one MEDIA_PLAY press every 30 minutes keeps the app's "are you still watching?"
# idle prompt from appearing, so the run does not lose a stretch of samples to a
# screen nobody is watching.
#
# Format: <index>-<code>-<Short|LongXXXX>-<delay_ms>-<count>
# delay_ms is BOTH the gap between repeats and the gap after a full pass, so with
# a single step it IS the press interval. Change 1800000 to retune - no code
# change is needed, and the report records which file was used.
#
# MEDIA_PLAY rides the `input keyevent` channel, which works on a user build
# (no root / userdebug needed). It does not move UI focus, and if playback has
# stalled it resumes it. Key names: ir_sequences/KEY_REFERENCE.md.
#
# NOTE: the steps below must stay indented - `steps` is a multi-line value, and
# an unindented line is a configparser syntax error, not a step.

steps =
    1-KEYCODE_MEDIA_PLAY-Short-1200000-1
	2-KEYCODE_MEDIA_PAUSE-Short-20000-1
